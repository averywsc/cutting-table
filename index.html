<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title></title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --ink: #111;
        --paper: #f4f3ee;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
        cursor: crosshair;
      }
      #dock {
        position: fixed;
        bottom: max(28px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px;
        background: #f9f8f3;
        border: 1px solid var(--ink);
        box-shadow: 3px 4px 0 #171712;
        user-select: none;
        touch-action: manipulation;
      }
      .tool {
        width: 45px;
        height: 43px;
        display: grid;
        place-items: center;
        color: var(--ink);
        border: 1px solid #111111;
        cursor: pointer;
        outline: none;
      }
      .tool svg {
        width: 25px;
        height: 25px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linejoin: round;
        stroke-linecap: round;
        pointer-events: none;
      }
      .tool:hover {
        border-color: #111;
        background: #eae8df;
      }
      .tool.active,
      .tool:active {
        border-color: #111;
        background: #111;
        color: #fff;
      }
      .tool:focus-visible {
        outline: 2px solid #111;
        outline-offset: 2px;
      }
      #divider {
        height: 27px;
        width: 1px;
        background: #111;
        margin: 0 4px;
      }
      #clear {
        width: 34px;
      }
      #clear svg {
        width: 20px;
        height: 20px;
      }
      input[hidden] {
        display: none;
      }
      @media (max-width: 520px) {
        #dock {
          bottom: max(20px, env(safe-area-inset-bottom));
          gap: 3px;
          padding: 5px;
        }
        .tool {
          width: 40px;
          height: 42px;
        }
        #clear {
          width: 31px;
        }
        #divider {
          margin: 0 2px;
        }
      }
      @media (max-width: 300px) {
        .tool {
          width: 32px;
        }
        #dock {
          gap: 1px;
        }
      }
      #scenes {
        position: fixed;
        top: max(27px, env(safe-area-inset-top));
        left: 40px;
        display: flex;
        background: #f9f8f3;
        color: var(--ink);
        border: 1px solid var(--ink);
        box-shadow: 2px 3px 0 #171712;
        user-select: none;
        touch-action: manipulation;
      }
      .scene {
        display: grid;
        place-items: center;
        width: 51px;
        height: 40px;
        cursor: pointer;
        outline: none;
      }
      .scene + .scene {
        border-left: 1px solid var(--ink);
      }
      .scene svg {
        width: 34px;
        height: 26px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .scene:hover {
        background: #e8e6dd;
      }
      .scene[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
      }
      .scene:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      @media (max-width: 600px) {
        #scenes {
          left: 50%;
          transform: translateX(-50%);
          top: max(21px, env(safe-area-inset-top));
        }
        .scene {
          width: 44px;
        }
      }
      #bladeModes {
        position: absolute;
        bottom: calc(100% + 9px);
        left: 56%;
        transform: translateX(-50%);
        display: flex;
        background: var(--paper);
        border: 1px solid var(--ink);
        box-shadow: 2px 3px 0 var(--ink);
      }
      #bladeModes[hidden] {
        display: none;
      }
      .mode {
        width: 42px;
        height: 38px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: var(--ink);
      }
      .mode + .mode {
        border-left: 1px solid var(--ink);
      }
      .mode svg {
        width: 24px;
        height: 24px;
        pointer-events: none;
      }
      .mode:hover {
        background: #e8e6dd;
      }
      .mode[aria-pressed="true"] {
        background: var(--ink);
        color: white;
      }
      .mode:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      [data-tool="world"] {
        position: relative;
      }
      [data-tool="world"]::after {
        content: "";
        position: absolute;
        right: 3px;
        top: 3px;
        border-top: 4px solid currentColor;
        border-left: 4px solid transparent;
      }
      #stageControls {
        position: fixed;
        right: 40px;
        top: max(27px, env(safe-area-inset-top));
        display: flex;
        border: 1px solid var(--ink);
        box-shadow: 2px 3px 0 var(--ink);
        background: #f9f8f3;
        touch-action: manipulation;
      }
      #stageControls .tool {
        width: 45px;
        height: 40px;
        border: 0;
      }
      #stageControls #nuke {
        color: #111;
        background: #ef6739;
        border-left: 1px solid var(--ink);
      }
      #stageControls #nuke[aria-disabled="true"] {
        background: var(--ink);
        color: #ef6739;
      }
      #stageControls #nuke:hover {
        box-shadow: inset 0 0 0 2px var(--ink);
      }
      @media (max-width: 600px) {
        #scenes {
          left: 12px;
          transform: none;
        }
        .scene {
          width: clamp(28px, 10.8vw, 44px);
        }
        #stageControls {
          right: 12px;
          top: max(21px, env(safe-area-inset-top));
        }
        #stageControls .tool {
          width: clamp(28px, 10.6vw, 43px);
        }
      }
    </style>

    <script>
      "use strict";
      const canvas = document.querySelector("#stage"),
        ctx = canvas.getContext("2d");
      const INK = "#111111",
        PAPER = "#F4F3EE",
        ORANGE = "#f55226",
        BLUE = "#305ac6",
        TAU = Math.PI * 2;
      const pt = (x, y) => ({ x, y }),
        add = (a, b) => pt(a.x + b.x, a.y + b.y);
      const minus = (a, b) => pt(a.x - b.x, a.y - b.y),
        mul = (a, n) => pt(a.x * n, a.y * n);
      const dot = (a, b) => a.x * b.x + a.y * b.y,
        cross = (a, b) => a.x * b.y - a.y * b.x;
      const length = (a) => Math.hypot(a.x, a.y),
        unit = (a) => mul(a, 1 / (length(a) || 1)),
        perp = (a) => pt(-a.y, a.x);
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x)),
        dist = (a, b) => length(minus(a, b));
      const rot = (p, a) =>
        pt(Math.cos(a) * p.x - Math.sin(a) * p.y, Math.sin(a) * p.x + Math.cos(a) * p.y);
      const mix = (a, b, t) => add(a, mul(minus(b, a), t));
      const rand = (a, b) => a + Math.random() * (b - a);
      function seeded(seed) {
        return () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296;
      }
      function polygon(g, p) {
        g.beginPath();
        g.moveTo(p[0].x, p[0].y);
        for (let i = 1; i < p.length; i++) g.lineTo(p[i].x, p[i].y);
        g.closePath();
      }
      const points = (arr) => arr.map(([x, y]) => pt(x, y));
      const circle = (r, n = 48) =>
        Array.from({ length: n }, (_, i) =>
          pt(r * Math.cos((i * TAU) / n), r * Math.sin((i * TAU) / n)),
        );
      function bounds(p) {
        let l = Infinity,
          t = l,
          r = -l,
          b = -l;
        for (const q of p) {
          l = Math.min(l, q.x);
          r = Math.max(r, q.x);
          t = Math.min(t, q.y);
          b = Math.max(b, q.y);
        }
        return { l, t, r, b };
      }
      function area(p) {
        let a = 0;
        for (let i = 0; i < p.length; i++) a += cross(p[i], p[(i + 1) % p.length]);
        return a * 0.5;
      }
      function clean(p) {
        let out = [];
        for (const q of p) if (!out.length || dist(out.at(-1), q) > 0.0001) out.push(q);
        if (out.length > 1 && dist(out[0], out.at(-1)) < 0.0001) out.pop();
        let changed = true;
        while (changed && out.length > 3) {
          changed = false;
          for (let i = 0; i < out.length; i++) {
            let a = out[(i + out.length - 1) % out.length],
              b = out[i],
              c = out[(i + 1) % out.length];
            if (Math.abs(cross(minus(b, a), minus(c, b))) < 1e-6) {
              out.splice(i, 1);
              changed = true;
              break;
            }
          }
        }
        return area(out) < 0 ? out.reverse() : out;
      }
      function centroid(p) {
        let x = 0,
          y = 0,
          s = 0;
        for (let i = 0; i < p.length; i++) {
          let a = p[i],
            b = p[(i + 1) % p.length],
            k = cross(a, b);
          s += k;
          x += (a.x + b.x) * k;
          y += (a.y + b.y) * k;
        }
        return pt(x / (3 * s), y / (3 * s));
      }
      function convex(p) {
        return p.every(
          (b, i) =>
            cross(minus(b, p[(i + p.length - 1) % p.length]), minus(p[(i + 1) % p.length], b)) >=
            -1e-7,
        );
      }
      function insideTri(p, a, b, c) {
        return (
          cross(minus(b, a), minus(p, a)) >= -0.000001 &&
          cross(minus(c, b), minus(p, b)) >= -0.000001 &&
          cross(minus(a, c), minus(p, c)) >= -0.000001
        );
      }
      // Partition concave silhouettes into convex collision and clipping cells.
      function partition(p) {
        if (convex(p)) return [p];
        let loop = p.slice(),
          cells = [];
        while (loop.length > 3) {
          let clipped = false;
          for (let i = 0; i < loop.length; i++) {
            const a = loop[(i + loop.length - 1) % loop.length],
              b = loop[i],
              c = loop[(i + 1) % loop.length];
            if (
              cross(minus(b, a), minus(c, b)) <= 0 ||
              loop.some((q) => q !== a && q !== b && q !== c && insideTri(q, a, b, c))
            )
              continue;
            cells.push([a, b, c]);
            loop.splice(i, 1);
            clipped = true;
            break;
          }
          if (!clipped) return [];
        }
        cells.push(loop);
        let merged = true;
        while (merged) {
          merged = false;
          outer: for (let i = 0; i < cells.length; i++)
            for (let j = i + 1; j < cells.length; j++) {
              let a = cells[i],
                b = cells[j];
              for (let k = 0; k < a.length; k++) {
                let u = a[k],
                  v = a[(k + 1) % a.length],
                  h = b.indexOf(v);
                if (h < 0 || b[(h + 1) % b.length] !== u) continue;
                let join = Array.from(
                  { length: a.length },
                  (_, n) => a[(k + 1 + n) % a.length],
                ).concat(Array.from({ length: b.length - 2 }, (_, n) => b[(h + 2 + n) % b.length]));
                if (convex(join)) {
                  cells[i] = join;
                  cells.splice(j, 1);
                  merged = true;
                  break outer;
                }
              }
            }
        }
        return cells;
      }
      function clip(p, o, n) {
        let out = [];
        for (let i = 0; i < p.length; i++) {
          const a = p[i],
            b = p[(i + 1) % p.length],
            da = dot(minus(a, o), n),
            db = dot(minus(b, o), n);
          if (da >= 0) out.push(a);
          if ((da > 0 && db < 0) || (da < 0 && db > 0)) out.push(mix(a, b, da / (da - db)));
        }
        return out;
      }
      // Shared interior edges cancel, leaving one perimeter for each connected fragment.
      const pointKey = (p) => Math.round(p.x * 1e5) + "," + Math.round(p.y * 1e5);
      function perimeters(cells) {
        const edges = new Map();
        for (const p of cells)
          for (let i = 0; i < p.length; i++) {
            let a = p[i],
              b = p[(i + 1) % p.length],
              ak = pointKey(a),
              bk = pointKey(b);
            if (ak === bk) continue;
            if (!edges.delete(bk + "|" + ak)) edges.set(ak + "|" + bk, { a, b, ak, bk });
          }
        const from = new Map();
        for (const e of edges.values()) {
          if (!from.has(e.ak)) from.set(e.ak, []);
          from.get(e.ak).push(e);
        }
        const out = [];
        for (const e of edges.values()) {
          if (e.used) continue;
          let loop = [],
            f = e;
          while (f && !f.used) {
            f.used = true;
            loop.push(f.a);
            if (f.bk === e.ak) break;
            f = from.get(f.bk)?.find((k) => !k.used);
          }
          if (loop.length >= 3 && f?.bk === e.ak) out.push(clean(loop));
        }
        return out;
      }
      let W = 0,
        H = 0,
        dpr = 1,
        bodies = [],
        effects = [],
        particles = [],
        gesture = null,
        tool = "draw",
        freeze = 0,
        live = false,
        clearing = null,
        epoch = 0;
      let tremor = pt(0, 0),
        shakeTime = 0,
        dragHover = false,
        now = performance.now(),
        nextId = 0;
      function body(p, mat, pos, angle = 0) {
        p = clean(p);
        let A = area(p);
        if (p.length < 3 || A < 1) return null;
        const c = centroid(p),
          cells = partition(p);

          g.moveTo(x, y - l * 0.5 * dy);
          g.lineTo(x, y + l * dy);
        }
        g.stroke();
      }
      function resize() {
        let prevW = W,
          prevH = H,
          Wnew = canvas.clientWidth,
          Hnew = canvas.clientHeight;
        W = Wnew;
        H = Hnew;
        dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        makePaper();
        if (!prevW || (!live && !clearing && bodies.length)) {
          bodies = [];
          starter();
        } else if (prevW && prevH)
          for (let b of bodies) b.pos = pt((b.pos.x * W) / prevW, (b.pos.y * H) / prevH);
      }
      function drawBody(b) {
        let g = ctx;
        g.save();
        g.translate(b.pos.x, b.pos.y);
        g.rotate(b.angle);
        g.translate(-b.c.x, -b.c.y);
        polygon(g, b.p);
        g.fillStyle = PAPER;
        g.shadowColor = "rgba(25,25,18,.2)";
        g.shadowBlur = 3.2 * dpr;
        g.shadowOffsetX = 2.3 * dpr;
        g.shadowOffsetY = 4 * dpr;
        g.fill();
        g.shadowColor = "transparent";
        g.save();
        g.clip();
        let m = b.mat;
        g.drawImage(m.image, m.l, m.t, m.w, m.h);
        g.restore();
        g.strokeStyle = INK;
        g.lineWidth = 1.5;
        g.lineJoin = "round";
        g.stroke();
        if (b.fuse !== null) {
          g.save();
          polygon(g, b.p);
          g.clip();
          g.strokeStyle = ORANGE;
          g.lineWidth = 2.7;
          g.beginPath();
          g.arc(
            b.c.x,
            b.c.y,
            b.r * (0.26 + 0.42 * clamp(b.fuse / 1.65, 0, 1)),
            -Math.PI / 2,
            -Math.PI / 2 + TAU * clamp(b.fuse / 1.65, 0, 1),
          );
          g.stroke();
          g.restore();
        }
        g.restore();
      }
      function line(g, a, b, color, width = 1) {
        g.beginPath();
        g.moveTo(a.x, a.y);
        g.lineTo(b.x, b.y);
        g.strokeStyle = color;
        g.lineWidth = width;
        g.stroke();
      }
      function bladeTrail(a, b, width, color) {
        let n = perp(unit(minus(b, a))),
          m = mix(a, b, 0.65);
        polygon(ctx, [a, add(m, mul(n, width * 0.5)), b, minus(m, mul(n, width * 0.5))]);
        ctx.fillStyle = color;
        ctx.fill();
      }
      function drawGesture() {
        if (!gesture) return;
        const g = gesture;
        if (g.tool === "draw") {
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          strokePath(ctx, g.p);
          if (closedStroke(g.p)) {
            ctx.closePath();
            ctx.fillStyle = "rgba(17,17,17,.08)";
            ctx.fill();
            ctx.lineWidth = 1.5;
          } else ctx.lineWidth = 10;
          ctx.strokeStyle = INK;
          ctx.stroke();
        } else {
          let a = g.start,
            b = g.last,
            d = unit(minus(b, a));
          if (g.tool === "world" && dist(a, b) > 2) {
            ctx.setLineDash([7, 7]);
            const pattern = strikePattern(a, b, bladeMode);
            for (const stroke of pattern) {
              const [from, to] = strikeSpan(stroke.center, stroke.axis);
              line(ctx, from, to, stroke.delay ? "#a49a8d" : "#646761", 1);
            }
            ctx.setLineDash([]);
            if (bladeMode === "crosscut") {
              const c = pattern[0].center;
              ctx.beginPath();
              ctx.arc(c.x, c.y, 8, 0, TAU);
              ctx.strokeStyle = ORANGE;
              ctx.stroke();
            }
          }
          bladeTrail(a, b, clamp(2 + g.speed * 0.003, 2, 8), INK);
          ctx.beginPath();
          ctx.arc(a.x, a.y, 3, 0, TAU);
          ctx.fillStyle = INK;
          ctx.fill();
        }
      }
      function drawSwordWake(f, t) {
        const axis = unit(minus(f.b, f.a)),
          n = perp(axis),
          worldCut = f.type === "world";
        const energy = worldCut ? 1 : f.type === "crosscut" ? 0.73 : 0.4;
        const fade = (1 - t) ** 2,
          span = dist(f.a, f.b);
        const front = mix(f.a, f.b, Math.min(1, t * (worldCut ? 5 : 6)));
        // The sheet slips at the seam during hit-stop, carrying its actual ink and grid with it.
        if (worldCut && t < 0.174) {
          ctx.save();
          const thickness = 9 + 10 * (1 - t / 0.174);
          polygon(ctx, [f.a, f.b, add(f.b, mul(n, thickness)), add(f.a, mul(n, thickness))]);
          ctx.clip();
          ctx.drawImage(canvas, axis.x * 11, axis.y * 11, W, H);
          ctx.restore();
          ctx.save();
          ctx.globalCompositeOperation = "difference";
          ctx.fillStyle = "#fff";
          ctx.fillRect(-24, -24, W + 48, H + 48);
          ctx.restore();
        }
        const light = worldCut && t < 0.174;
        line(ctx, f.a, f.b, light ? PAPER : INK, Math.max(0.6, (3 + energy * 4) * fade));
        for (const side of [-1, 1]) {
          const offset = mul(n, side * (3 + energy * 2) * fade);
          line(
            ctx,
            add(f.a, offset),
            add(f.b, offset),
            side < 0 ? ORANGE : BLUE,
            (0.8 + energy) * fade + 0.2,
          );
        }
        // A traveling nib of white ink is followed by curved pressure streaks.
        ctx.save();
        ctx.globalAlpha = (1 - t) * 0.9;
        const tip = add(front, mul(axis, span * 0.035)),
          tail = minus(front, mul(axis, Math.min(265, span * 0.3)));
        polygon(ctx, [
          tip,
          add(mix(tail, tip, 0.74), mul(n, energy * 7 * fade)),
          tail,
          minus(mix(tail, tip, 0.62), mul(n, energy * 2.6 * fade)),
        ]);
        ctx.fillStyle = PAPER;
        ctx.fill();
        for (let i = 0; i < 7; i++) {
          const k = (0.13 + i * 0.143 + f.seed * 0.35) % 1,
            side = i % 2 ? -1 : 1;
          const pos = add(mix(f.a, f.b, k), mul(axis, t * (30 + i * 7)));
          const spread = side * (3 + (i % 3) * 2 + t * (8 + energy * 14));
          const start = add(pos, mul(n, spread)),
            end = add(start, mul(axis, 36 + i * 6 + energy * 30));
          ctx.beginPath();
          ctx.moveTo(start.x, start.y);
          const bow = add(mix(start, end, 0.5), mul(n, side * (1 + t) * energy * 4));
          ctx.quadraticCurveTo(bow.x, bow.y, end.x, end.y);
          ctx.strokeStyle = i % 3 === 0 ? ORANGE : light ? PAPER : INK;
          ctx.lineWidth = (1.35 - i * 0.09) * fade + 0.2;
          ctx.stroke();
        }
        ctx.restore();
      }
      function drawFX(dt) {
        for (const p of particles) {
          p.life -= dt;
          p.p = add(p.p, mul(p.v, dt));
          p.v.y += dt * (p.dust ? 160 : 480);
          p.v.x *= Math.exp(-dt * 2);
          p.a += dt * 4;
          ctx.save();
          ctx.translate(p.p.x, p.p.y);
          ctx.rotate(p.a);
          ctx.globalAlpha = clamp((p.life / p.max) * 1.6, 0, 1);
          ctx.fillStyle = p.c;
          if (p.dust) {
            ctx.beginPath();
            ctx.arc(0, 0, p.r * (1.4 - (p.life / p.max) * 0.5), 0, TAU);
            ctx.fill();
          } else {
            polygon(ctx, [pt(-p.r * 2, 0), pt(p.r, -p.r * 0.55), pt(p.r * 0.6, p.r * 0.5)]);
            ctx.fill();
          }
          ctx.restore();
        }
        particles = particles.filter((p) => p.life > 0);
        for (let f of effects) {
          let t = clamp((now - f.born) / f.dur, 0, 1);
          ctx.save();
          ctx.globalAlpha = 1 - t;
          if (f.type === "blast") {
            ctx.strokeStyle = INK;
            ctx.lineWidth = (1 - t) * 2.7;
            ctx.beginPath();
            ctx.arc(f.p.x, f.p.y, 3 + f.r * (1 - (1 - t) ** 3), 0, TAU);
            ctx.stroke();
            if (t < 0.16) {
              ctx.fillStyle = "rgba(250,249,240,.65)";
              ctx.fill();
            }
          } else if (f.type === "pressure") {
            ctx.strokeStyle = INK;
            ctx.lineWidth = 2.4 * (1 - t) + 0.4;
            ctx.beginPath();
            const r = 4 + f.r * (1 - (1 - t) ** 3);
            ctx.arc(f.p.x, f.p.y, r, 0, TAU);
            ctx.stroke();
            for (let k = 0; k < 8; k++) {
              const d = rot(pt(1, 0), (k * TAU) / 8 + 0.2);
              bladeTrail(
                add(f.p, mul(d, r * 0.78)),
                add(f.p, mul(d, r * (1.08 + (k % 3) * 0.16))),
                2.5 * (1 - t),
                INK,
              );
            }
          } else if (["world", "crosscut", "flurry"].includes(f.type)) {
            drawSwordWake(f, t);
          } else bladeTrail(f.a, f.b, f.width * (1 - t), INK);
          ctx.restore();
        }
        effects = effects.filter((f) => now - f.born < f.dur);
      }
      let previous = performance.now(),
        accum = 0;
      function frame(timestamp) {
        now = timestamp;
        let dt = Math.min(0.04, Math.max(0, (now - previous) / 1000));
        previous = now;
        updateNuke();
        const due = queuedCuts.findIndex((strike) => strike.at <= now);
        if (due >= 0) landCut(queuedCuts.splice(due, 1)[0]);
        if (live && !clearing && now >= freeze) {
          accum += dt;
          while (accum >= 1 / 100) {
            step(0.01);
            accum -= 0.01;
            if (now < freeze) {
              accum = 0;
              break;
            }
          }
        } else accum = 0;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.drawImage(background, 0, 0, W, H);
        ctx.save();
        let age = (now - shakeTime) / 1000,
          motion = Math.exp(-age * 15) * Math.cos(age * 90);
        ctx.translate(tremor.x * motion, tremor.y * motion);
        if (age > 0.8) tremor = pt(0, 0);
        if (clearing) {
          let t = clamp((now - clearing.start) / 490, 0, 1);
          ctx.save();
          ctx.translate(0, t * t * (H + 250));
          for (let b of bodies) drawBody(b);
          ctx.restore();
          let y = t * t * H;
          line(ctx, pt(0, y), pt(W, y), "rgba(17,17,17," + Math.sin(t * Math.PI) * 0.5 + ")");
          if (t >= 1) finishClear();
        } else for (let b of bodies) drawBody(b);
        drawFX(dt);
        drawNuke();
        drawGesture();
        ctx.restore();
        if (dragHover) {
          ctx.setLineDash([9, 7]);
          ctx.strokeStyle = INK;
          ctx.lineWidth = 2;
          ctx.strokeRect(12, 12, W - 24, H - 24);
          ctx.setLineDash([]);
        }
        requestAnimationFrame(frame);
      }
      resize();
      window.addEventListener("resize", resize);
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
